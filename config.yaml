# optbot configuration. Kept in the repo (no secrets here) so updates reach the server automatically.
# Secrets (API key, client code, PIN, TOTP key, Telegram token) do NOT go here:
# they go in the .env file next to it, which only lives on your server.

mode: paper            # paper is the only mode this build supports. There is no live order code.
data_dir: ./data       # journals, state and recorded market data
loop_seconds: 15       # how often the engine checks the market

market:
  pre_open: "08:45"    # log in, load instruments, write playbook
  open: "09:15"
  first_entry: "09:30" # no entries before the opening range is complete
  last_entry: "14:00"
  square_off: "15:10"  # all positions closed by this time
  expiry_day_exit: "14:30"  # positions in a contract expiring today are closed by this time
  close: "15:30"
  # Exchange holidays (YYYY-MM-DD). Keep this updated from NSE's holiday list.
  holidays:
    - "2026-11-24"
    - "2026-12-25"
  # Days to sit out completely (RBI policy, Budget, big events).
  no_trade_days: []

# Indices the bot may trade. Lot sizes, strikes and expiries are read from Angel One's
# instrument file every morning, so only the names and strike step live here.
indices:
  NIFTY:     {segment: NFO, spot_exchange: NSE, spot_names: ["Nifty 50", "NIFTY"],          strike_step: 50}
  BANKNIFTY: {segment: NFO, spot_exchange: NSE, spot_names: ["Nifty Bank", "BANKNIFTY"],    strike_step: 100}
  FINNIFTY:  {segment: NFO, spot_exchange: NSE, spot_names: ["Nifty Fin Service", "FINNIFTY"], strike_step: 50}
  SENSEX:    {segment: BFO, spot_exchange: BSE, spot_names: ["SENSEX", "Sensex"],           strike_step: 100}
  BANKEX:    {segment: BFO, spot_exchange: BSE, spot_names: ["BANKEX", "Bankex"],           strike_step: 100}

# Stock options the "Option buying" style may trade (NSE F&O stocks with busy option markets).
# Lot sizes, strikes and expiries come from Angel One's instrument file each morning.
stocks:
  names: [RELIANCE, HDFCBANK, ICICIBANK, SBIN, INFY, TCS, AXISBANK, KOTAKBANK, BHARTIARTL, LT]
  max_leg_spread_pct: 8.0      # stock options have wider bid/ask gaps than index options

vix:
  names: ["India VIX", "INDIA VIX"]
  max_for_entry: 25    # no new entries above this VIX
  no_trade_above: 30   # whole day off above this

strategy:
  opening_range_minutes: 15
  ema_fast: 9
  ema_slow: 21
  atr_period: 14
  min_breakout_atr: 0.1   # breakout must clear the range by at least this many ATRs
  max_breakout_atr: 1.5   # ...and not more (don't chase)
  min_days_to_expiry: 1   # don't open 0-DTE trades
  max_spread_width_steps: 6
  min_reward_to_risk: 1.0
  max_leg_spread_pct: 5.0
  # Tighter trailing once a trade is well up: [gain on the amount paid, max share of the gain to give back].
  # E.g. once the spread is worth double what was paid (+100%), give back at most 15% of the gain.
  trail_tighten:
    - [0.60, 0.22]
    - [1.00, 0.15]
    - [1.50, 0.10] # skip options whose bid/ask gap is wider than this % of price

# Each profile is a separate paper account run side by side on the same market data,
# so the daily report compares them directly.
profiles:
  conservative:
    # 19 Nov: Chinmay asked for buying only, no selling: bought calls/puts instead of spreads.
    style: buy
    capital: 20000
    max_lots: 1
    max_debit_per_lot: 12000     # max premium paid per lot
    max_risk_per_trade: 4000
    stop_pct: 0.30               # stop when the option loses 30% of what was paid
    exit_mode: trail
    target_pct_of_max_profit: null
    trail_trigger_pct: 0.30      # once up 30% on the debit, start trailing
    trail_giveback_pct: 0.35     # trailing stop gives back 35% of the peak gain
    daily_profit_target: 1000    # no new entries after this
    daily_profit_lock_pct: 0.80  # after target, keep at least 80% of it
    daily_loss_cap: 1000
    max_losing_trades_per_day: 1
    weekly_loss_cap: 2000
    account_floor: 15000
    max_open_positions: 1
    max_trades_per_day: 2

  target_5k:
    # Chinmay's goal: aim for ₹5k+/day, let winners run on a trailing stop, no fixed profit cap.
    # 19 Nov: Chinmay asked for buying only, no selling: bought calls/puts instead of spreads.
    style: buy
    capital: 20000
    max_lots: 10                 # lots are limited by capital and the risk cap below
    max_debit_per_lot: 12000
    max_risk_per_trade: 4000
    stop_pct: 0.30
    exit_mode: trail             # winners exit only on the trailing stop (or time)
    target_pct_of_max_profit: null
    trail_trigger_pct: 0.20
    trail_giveback_pct: 0.30
    daily_profit_target: 5000    # after ₹5k, new entries continue only while lock is held
    daily_profit_lock_pct: 0.80
    continue_after_target: true
    daily_loss_cap: 2000
    max_losing_trades_per_day: 2
    weekly_loss_cap: 4000
    account_floor: 15000
    max_open_positions: 2
    max_trades_per_day: 4
    max_capital_in_use_pct: 0.80

  swing:
    # Holds 1-2 days when the daily trend and the day's breakout strongly agree. Overnight only while
    # the trade is in profit and the trend still agrees; closed at the latest on the 2nd day after entry.
    # Gap risk: the market can open sharply against an overnight hold. The spread caps the worst case.
    # 19 Nov: Chinmay asked for buying only, no selling: bought calls/puts instead of spreads.
    style: buy
    capital: 20000
    max_lots: 2
    max_debit_per_lot: 12000
    max_risk_per_trade: 12000    # a bought option held overnight can lose all of what was paid
    stop_pct: 0.40
    exit_mode: trail
    target_pct_of_max_profit: null
    trail_trigger_pct: 0.30
    trail_giveback_pct: 0.35
    daily_profit_target: 5000
    daily_profit_lock_pct: 0.80
    continue_after_target: true
    daily_loss_cap: 2000
    max_losing_trades_per_day: 1
    weekly_loss_cap: 3000
    account_floor: 15000
    max_open_positions: 1
    max_trades_per_day: 1
    max_capital_in_use_pct: 0.80
    hold_overnight: true
    max_hold_days: 2
    min_days_to_expiry: 4        # use an expiry far enough out that the hold never runs into it
    min_trend_confidence: 0.30   # daily trend must be clearly up (for calls) or down (for puts)
    min_signal_strength: 0.30    # and the day's breakout must be decent, not marginal

  option_buyer:
    # Buys one option only (a call when the bot expects a rise, a put for a fall), on indices AND stocks.
    # Simple, no margin, unlimited upside, but time decay works against it every minute it is held.
    capital: 20000
    style: buy
    # 19 Nov: rule G = rule D plus a confirming candle (engulfing, hammer/shooting star, strong close or inside-bar
    # break) on the signal bar: +₹366/trade last year (n=218), +₹374 the 2 years before (n=421). Previously:
    # Sniper-style rule D on the 1-hour chart (band cross + MACD, RSI, Supertrend, VWMA, pivot all agree), full exit at
    # TP1. The only tested setting that made money in BOTH the last year (+₹185/trade, n=390) and the 2 years before
    # (+₹147/trade, n=641). Weak (t≈1), so this is a live paper test, not a proven edge. Rule E (15m) was dropped on
    # 18 Nov: +₹175/trade last year but −₹214/trade (t=−3.8) over the older 2 years.
    entry_signal: sniper
    sniper: {rule: G, tf: 60, sl_atr: 1.5, tp_step: 2.0, exit: tp1}
    trade_indices: true
    trade_stocks: false          # 19 Nov: Nifty 50 test, rule G on stocks: -₹146/-₹156 per trade; the profit is in the indices
    max_lots: 2
    max_debit_per_lot: 12000     # most premium paid for 1 lot (one NIFTY lot is ~₹9-10k)
    max_risk_per_trade: 5000
    stop_pct: 0.50               # safety stop on the option price; the stock/index SL normally exits first
    exit_mode: trail
    target_pct_of_max_profit: null
    trail_trigger_pct: 5.0       # option-price trailing off: exits follow the TP levels instead
    trail_giveback_pct: 0.30
    daily_profit_target: 5000
    daily_profit_lock_pct: 0.60  # 19 Nov: 0.80 closed Kotak 495CE at 6.30; it closed the day at 8.55
    continue_after_target: true
    daily_loss_cap: 2500
    max_losing_trades_per_day: 2
    weekly_loss_cap: 5000
    account_floor: 15000
    max_open_positions: 3
    max_trades_per_day: 10  # 20 Nov: Chinmay: keep taking good trades while they work
    max_capital_in_use_pct: 0.80
    min_days_to_expiry: 2        # avoid options in their last day or two, when decay is fastest

  sniper:
    # The bot finds Sniper-style setups itself (rebuilt from the Sniper Short 2.0 indicator's visible rules,
    # plus MACD, RSI, Supertrend, VWMA and pivots), on indices and stocks, and buys one option per signal.
    # Exits on the index/stock price levels: SL, TP1, TP2, TP3. Settings below are set from the 3-year test.
    capital: 20000
    style: buy
    entry_signal: sniper
    # 3-year test (18 Nov): best on the last year = 15-min chart, all checks (rule F), SL 1.5 ATR, TP every 1.3x SL,
    # stop to entry at TP1: +₹529/trade (n=136), but −₹161/trade (n=327) over the 2 years before. Kept as the closest
    # copy of Chinmay's indicator, to measure it live; not a proven edge.
    # 19 Nov: switched to rule R = 1-hour rule D + a 20-bar range breakout, the most consistent of 34 candle/chart
    # patterns tested (research/pattern-results-2026-11-18.md): +₹536/trade (n=134) last year, +₹563 (n=289) before.
    # Runs side by side with option_buyer (rule G, candle confirmation) as a live comparison.
    sniper: {rule: R, tf: 60, sl_atr: 1.5, tp_step: 2.0, exit: tp1}
    trade_indices: true
    trade_stocks: false          # 19 Nov: Nifty 50 test, rule R on stocks: -₹58/-₹11 per trade; the profit is in the indices
    max_lots: 2
    max_debit_per_lot: 12000
    max_risk_per_trade: 5000
    stop_pct: 0.50               # safety stop on the option price; the index SL normally exits first
    exit_mode: trail
    target_pct_of_max_profit: null
    trail_trigger_pct: 5.0       # option-price trailing effectively off: exits follow the TP levels instead
    trail_giveback_pct: 0.30
    daily_profit_target: 5000
    daily_profit_lock_pct: 0.60  # 19 Nov: 0.80 closed Kotak 495CE at 6.30; it closed the day at 8.55
    continue_after_target: true
    daily_loss_cap: 3000
    max_losing_trades_per_day: 3
    weekly_loss_cap: 6000
    account_floor: 12000
    max_open_positions: 3
    max_trades_per_day: 10  # 20 Nov: Chinmay: keep taking good trades while they work
    max_capital_in_use_pct: 0.90
    min_days_to_expiry: 2

  stocks:
    # 19 Nov: stock options only, kept apart from the index accounts. Rule R on the 10 big stocks made
    # +₹102/trade last year and +₹217 the 2 years before (other Nifty 50 names lost), so only these 10.
    # The bot finds Sniper-style setups itself (rebuilt from the Sniper Short 2.0 indicator's visible rules,
    # plus MACD, RSI, Supertrend, VWMA and pivots), on indices and stocks, and buys one option per signal.
    # Exits on the index/stock price levels: SL, TP1, TP2, TP3. Settings below are set from the 3-year test.
    capital: 20000
    style: buy
    entry_signal: sniper
    # 3-year test (18 Nov): best on the last year = 15-min chart, all checks (rule F), SL 1.5 ATR, TP every 1.3x SL,
    # stop to entry at TP1: +₹529/trade (n=136), but −₹161/trade (n=327) over the 2 years before. Kept as the closest
    # copy of Chinmay's indicator, to measure it live; not a proven edge.
    # 19 Nov: switched to rule R = 1-hour rule D + a 20-bar range breakout, the most consistent of 34 candle/chart
    # patterns tested (research/pattern-results-2026-11-18.md): +₹536/trade (n=134) last year, +₹563 (n=289) before.
    # Runs side by side with option_buyer (rule G, candle confirmation) as a live comparison.
    sniper: {rule: R, tf: 60, sl_atr: 1.5, tp_step: 2.0, exit: tp1}
    trade_indices: false
    trade_stocks: true
    max_lots: 2
    max_debit_per_lot: 12000
    max_risk_per_trade: 5000
    stop_pct: 0.50               # safety stop on the option price; the index SL normally exits first
    exit_mode: trail
    target_pct_of_max_profit: null
    trail_trigger_pct: 5.0       # option-price trailing effectively off: exits follow the TP levels instead
    trail_giveback_pct: 0.30
    daily_profit_target: 5000
    daily_profit_lock_pct: 0.60  # 19 Nov: 0.80 closed Kotak 495CE at 6.30; it closed the day at 8.55
    continue_after_target: true
    daily_loss_cap: 3000
    max_losing_trades_per_day: 3
    weekly_loss_cap: 6000
    account_floor: 12000
    max_open_positions: 3
    max_trades_per_day: 6
    max_capital_in_use_pct: 0.90
    min_days_to_expiry: 2

  scalper:
    # Chinmay, 19 Nov: quick buy-only trades of about ₹10k, booked at a fixed % gain on the option within minutes,
    # up to 5 a day. Entry: a 5/15-minute trigger in the direction of the 1-hour trend. Exits on the option price:
    # +tp_pct target, -sl_pct stop, or a time stop. Settings from research/scalper_study.py (see the comment below).
    capital: 20000
    style: buy
    entry_signal: scalper
    # 19 Nov backtest (research/scalper_study.py, 3 years): every one of 108 settings lost, about -₹70 to -₹95 per trade
    # (roughly the charges). Least bad: indices, 15m pullback-break, +15% / -15%, 10 min. Runs on paper only to
    # measure it live, as Chinmay asked; not expected to make money.
    scalper: {tf: 15, trigger: pb, tp_pct: 0.15, sl_pct: 0.15, time_min: 10, budget: 10000}
    trade_indices: true
    trade_stocks: false
    max_lots: 10
    max_debit_per_lot: 15000
    max_risk_per_trade: 5000
    stop_pct: 0.30               # safety only; the scalper's own -sl_pct stop normally exits first
    exit_mode: trail
    target_pct_of_max_profit: null
    trail_trigger_pct: 5.0       # option-price trailing off: the scalper's own exits apply
    trail_giveback_pct: 0.30
    daily_profit_target: 6000
    daily_profit_lock_pct: 0.80
    continue_after_target: false # stop for the day at +₹6k
    daily_loss_cap: 3000
    max_losing_trades_per_day: 2 # stop after 2 losers
    weekly_loss_cap: 8000
    account_floor: 12000
    max_open_positions: 1
    max_trades_per_day: 5
    max_capital_in_use_pct: 0.75
    min_days_to_expiry: 1

  tradingview:
    # Trades ONLY the signals you send from your TradingView indicator with /tv (e.g. "/tv NIFTY up"),
    # by buying one option, so the indicator's real results can be measured separately from the bot's.
    capital: 20000
    style: buy
    signal_source: tradingview
    trade_indices: true
    trade_stocks: true
    max_lots: 2
    max_debit_per_lot: 10000
    max_risk_per_trade: 3000
    stop_pct: 0.30
    exit_mode: trail
    target_pct_of_max_profit: null
    trail_trigger_pct: 0.25
    trail_giveback_pct: 0.30
    daily_profit_target: 5000
    daily_profit_lock_pct: 0.80
    continue_after_target: true
    daily_loss_cap: 3000
    max_losing_trades_per_day: 3
    weekly_loss_cap: 6000
    account_floor: 12000
    max_open_positions: 3
    max_trades_per_day: 8
    max_capital_in_use_pct: 0.90
    min_days_to_expiry: 2

# Charges applied to every simulated order (Angel One + exchange + taxes).
# Verify against Angel One's brokerage calculator; edit if rates change.
charges:
  brokerage_per_order: 20.0
  stt_sell_pct: 0.15          # % of premium on option sells (Budget 2026 rate, from 1 Apr 2026)
  exchange_txn_pct: {NFO: 0.03503, BFO: 0.0325}
  sebi_fee_per_crore: 10.0
  stamp_buy_pct: 0.003
  gst_pct: 18.0

paper:
  slippage_ticks: 1            # fill 1 tick worse than the touch price
  max_order_rate_per_sec: 2

playbook:
  provider: rules              # rules | command
  # With provider: command, this shell command receives market context JSON on stdin and
  # must print a playbook JSON on stdout. Use it to plug in Vibe-Trading.
  command: ""
  command_timeout_sec: 180

# Save the option chain (prices and open interest, nearest expiry) every few minutes, to build our own
# history for testing option-chain signals later. Does not affect trading.
record_option_chain:
  enabled: true
  every_minutes: 5
  strikes_each_side: 10

notify:
  telegram: true               # needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID in .env
