name: optbot paper trading

# Runs the paper-trading bot during Indian market hours, in two parts because a GitHub job
# can run for at most 6 hours. State (paper accounts, journal) is carried between runs in
# the Actions cache, not committed to this public repo.
on:
  schedule:
    - cron: "15 2 * * 1-5"   # 07:45 IST: morning part, trades until 12:00
    - cron: "45 5 * * 1-5"   # 11:15 IST: afternoon part, waits for the morning run, trades to the close
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test login and send a Telegram message; morning / afternoon = run that part now"
        default: check
        type: choice
        options: [check, morning, afternoon]

concurrency:
  group: optbot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      OPTBOT_NO_RECORD: "1"
      OPTBOT_QUIET: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: optbot-state-${{ github.run_id }}
          restore-keys: optbot-state-

      - name: Pick mode
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="$INPUT_MODE"
          if [ -z "$MODE" ]; then
            if [ "$SCHEDULE" = "15 2 * * 1-5" ]; then MODE=morning; else MODE=afternoon; fi
          fi
          case "$MODE" in check|morning|afternoon) ;; *) echo "bad mode"; exit 1;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Self-test
        if: steps.mode.outputs.mode == 'check'
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Check login
        if: steps.mode.outputs.mode == 'check'
        run: python -m optbot check

      - name: Morning session
        if: steps.mode.outputs.mode == 'morning'
        run: python -m optbot session --until 12:00

      - name: Afternoon session
        if: steps.mode.outputs.mode == 'afternoon'
        run: python -m optbot session --until 15:40

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: optbot-state-${{ github.run_id }}
