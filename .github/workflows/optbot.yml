name: optbot paper trading

# Runs the paper-trading bot during Indian market hours, in two parts because a GitHub job
# can run for at most 6 hours. State (paper accounts, journal) is carried between runs in
# the Actions cache, not committed to this public repo.
on:
  # GitHub sometimes starts scheduled runs late or skips them, so each part has backup start times.
  # Extra starts are harmless: runs queue one at a time, and a part that already ran just exits.
  schedule:
    - cron: "7 2 * * 1-5"    # 07:37 IST  morning part (trades until 12:00)
    - cron: "37 2 * * 1-5"   # 08:07 IST  morning backup
    - cron: "3 3 * * 1-5"    # 08:33 IST  morning backup
    - cron: "33 3 * * 1-5"   # 09:03 IST  morning backup
    - cron: "47 5 * * 1-5"   # 11:17 IST  afternoon part (waits for the morning run, trades to the close)
    - cron: "17 6 * * 1-5"   # 11:47 IST  afternoon backup
    - cron: "52 6 * * 1-5"   # 12:22 IST  afternoon backup
    - cron: "37 7 * * 1-5"   # 13:07 IST  afternoon backup
  workflow_dispatch:
    inputs:
      mode:
        description: "check = test login and send a Telegram message; morning / afternoon = run that part now"
        default: check
        type: choice
        options: [check, morning, afternoon]

concurrency:
  group: optbot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # lets the morning run start the afternoon run itself

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      OPTBOT_NO_RECORD: "1"
      OPTBOT_QUIET: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: optbot-state-${{ github.run_id }}
          restore-keys: optbot-state-

      - name: Pick mode
        id: mode
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="$INPUT_MODE"
          if [ -z "$MODE" ]; then
            # decide by the current time: before 11:00 IST it's the morning part
            if [ "$(TZ=Asia/Kolkata date +%H%M)" -lt 1100 ]; then MODE=morning; else MODE=afternoon; fi
          fi
          case "$MODE" in check|morning|afternoon) ;; *) echo "bad mode"; exit 1;; esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Self-test
        if: steps.mode.outputs.mode == 'check'
        run: python -m pytest -q -p no:cacheprovider tests

      - name: Check login
        if: steps.mode.outputs.mode == 'check'
        run: python -m optbot check

      - name: Morning session
        if: steps.mode.outputs.mode == 'morning'
        run: python -m optbot session --until 12:00

      - name: Afternoon session
        if: steps.mode.outputs.mode == 'afternoon'
        run: python -m optbot session --until 15:40

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: optbot-state-${{ github.run_id }}

      # GitHub's timers are unreliable, so the morning run starts the afternoon run itself
      # (unless one is already queued or running). It waits in the queue until the morning run ends.
      - name: Hand over to the afternoon run
        if: always() && steps.mode.outputs.mode == 'morning'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          busy=$(gh api "repos/$REPO/actions/runs?status=queued" --jq "[.workflow_runs[] | select(.id != $SELF and .name == \"optbot paper trading\")] | length")
          if [ "$busy" != "0" ]; then echo "a run is already queued"; exit 0; fi
          gh api -X POST "repos/$REPO/actions/workflows/optbot.yml/dispatches" -f ref=main -f 'inputs[mode]=afternoon'
          echo "afternoon run requested"

