name: global cues and indicator combinations study

# Read-only research (20 Nov 2026): does the morning global check (US, Asia, gap) help, and does any
# combination of 15 indicators work on years it was not tuned on? Start it only outside market hours.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "years of history"
        default: "3"

concurrency:
  group: optbot-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TZ: Asia/Kolkata
      YEARS: ${{ github.event.inputs.years }}
    steps:
      - name: Refuse during market hours
        run: |
          now=$(date +%H%M); dow=$(date +%u)
          if [ "$dow" -le 5 ] && [ "$now" -ge 0830 ] && [ "$now" -le 1535 ]; then
            echo "Market hours: not logging in while the paper-trading session runs."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Try the morning note (US, Asia, Moneycontrol)
        run: python -c "from optbot.morning import morning_note; print(morning_note() or 'nothing fetched')"
      - name: Download global market history (Yahoo Finance, no login)
        run: python research/edge_study.py global --out global_data
      - name: Download index price history
        run: python research/sniper_study.py fetch --out sniper_data --years "${YEARS:-3}"
      - name: Run the study
        run: python research/edge_study.py analyze --data sniper_data --global global_data --report edge_report.md && cat edge_report.md >> "$GITHUB_STEP_SUMMARY"
