name: morning note check

# Prints the morning global note (markets + headlines) so feed problems can be seen. No login, no secrets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python -c "import logging; logging.basicConfig(level=logging.WARNING); from optbot.morning import morning_note; print(morning_note() or 'nothing fetched')"
